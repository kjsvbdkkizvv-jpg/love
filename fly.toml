# fly.toml app configuration file generated for love-pz8ilw on 2026-08-23T13:24:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'love-pz8ilw'
primary_region = 'iad'

[build]

[env]
  DB_PATH = '/app/data/looksmatch.db'
  PYTHONUNBUFFERED = '1'

[[mounts]]
  source = 'looksmatch_data'
  destination = '/app/data'
  initial_size = '1GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
