app = "love-pz8ilw"

primary_region = "iad"

[build]

[env]
PYTHONUNBUFFERED = "1"
DB_PATH = "/app/data/looksmatch.db"
PORT = "8080"

[mounts]
source = "looksmatch_data"
destination = "/app/data"
initial_size = "1GB"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
